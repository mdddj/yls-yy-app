name: Build And Release macOS App

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos-app:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build app bundle
        run: |
          chmod +x scripts/build_macos_app.sh
          BUILD_ARCHS="arm64 x86_64" APP_VERSION="${GITHUB_REF_NAME#v}" APP_BUILD="${GITHUB_RUN_NUMBER}" scripts/build_macos_app.sh

      - name: Verify universal app bundle
        run: |
          APP_BINARY="dist/伊莉思Codex账户监控助手.app/Contents/MacOS/yls-yy-app"
          ARCHS="$(lipo -archs "$APP_BINARY")"
          echo "Packaged architectures: $ARCHS"
          [[ "$ARCHS" == *"arm64"* && "$ARCHS" == *"x86_64"* ]]

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-app-bundle-and-dmg
          path: |
            dist/*.app
            dist/*.dmg
          if-no-files-found: error

      - name: Remove existing release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ASSET_NAME="$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[] | select(.name | endswith(".dmg")) | .name' 2>/dev/null || true)"
          if [[ -n "$ASSET_NAME" ]]; then
            echo "Removing existing asset: $ASSET_NAME"
            gh release delete-asset "$GITHUB_REF_NAME" "$ASSET_NAME" --yes
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
          generate_release_notes: true
